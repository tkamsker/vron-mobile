# GraphQL Schema for VRON Mobile Companion
# API Endpoint: https://api.vron.stage.motorenflug.at/graphql
# Headers: Authorization: Bearer <AUTH_CODE>, X-VRon-Platform: "merchants"

# ============================================================================
# Authentication
# ============================================================================

input SignInInput {
  email: String!
  password: String!
}

type SignInPayload {
  accessToken: String!
}

# ============================================================================
# Projects
# ============================================================================

type Project {
  id: ID!
  name: String!
  description: String
  status: ProjectStatus!
  thumbnailUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
  rooms: [Room!]!
}

enum ProjectStatus {
  ACTIVE
  INACTIVE
}

type ProjectConnection {
  edges: [ProjectEdge!]!
  pageInfo: PageInfo!
}

type ProjectEdge {
  node: Project!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input UpdateProjectInput {
  id: ID!
  name: String
  description: String
  status: ProjectStatus
}

# ============================================================================
# Rooms
# ============================================================================

type Room {
  id: ID!
  projectId: ID!
  name: String!
  scanDate: DateTime!
  sceneGlbUrl: String
  navmeshGlbUrl: String
  sceneFileSize: Int
  navmeshFileSize: Int
  processingStatus: RoomProcessingStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum RoomProcessingStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

input CreateRoomInput {
  projectId: ID!
  name: String!
  scanDate: DateTime!
}

input UploadRoomAssetsInput {
  roomId: ID!
  sceneGlbUrl: String
  navmeshGlbUrl: String
  sceneFileSize: Int
  navmeshFileSize: Int
}

input UpdateRoomInput {
  id: ID!
  name: String
}

# ============================================================================
# File Uploads
# ============================================================================

"""
Request presigned upload URL for GLB file.
Client uploads directly to S3/CDN with presigned URL, then calls uploadRoomAssets.
"""
type UploadUrl {
  uploadUrl: String!
  fileKey: String!
  expiresAt: DateTime!
}

input RequestUploadUrlInput {
  roomId: ID!
  fileType: FileType!
  fileName: String!
  fileSize: Int!
}

enum FileType {
  SCENE_GLB
  NAVMESH_GLB
}

# ============================================================================
# Demo Assets
# ============================================================================

type DemoAsset {
  id: ID!
  theme: DemoTheme!
  name: String!
  glbUrl: String!
  previewThumbnailUrl: String!
  description: String
  metadata: JSON
  displayOrder: Int!
}

enum DemoTheme {
  SAILING
  AVIATION
}

# ============================================================================
# Scalar Types
# ============================================================================

"""
DateTime scalar in ISO 8601 format (e.g., 2025-11-30T14:23:00Z).
"""
scalar DateTime

"""
JSON scalar for arbitrary JSON data (e.g., demo asset metadata).
"""
scalar JSON

# ============================================================================
# Error Codes
# ============================================================================

"""
Standard error responses follow GraphQL spec with extensions.
Error codes in extensions.code:
- UNAUTHENTICATED: Missing or invalid auth token
- FORBIDDEN: Insufficient permissions for operation
- NOT_FOUND: Requested resource does not exist
- VALIDATION_ERROR: Input validation failed
- FILE_TOO_LARGE: Uploaded file exceeds 50MB limit
- RATE_LIMIT_EXCEEDED: Too many requests (429)
- INTERNAL_SERVER_ERROR: Unexpected server error (500)
"""

# ============================================================================
# Root Types
# ============================================================================

type Query {
  # Authentication - none needed (mutations only)

  # Projects
  projects(first: Int = 20, after: String): ProjectConnection!
  project(id: ID!): Project

  # Rooms
  rooms(projectId: ID!): [Room!]!
  room(id: ID!): Room

  # File Uploads
  requestUploadUrl(input: RequestUploadUrlInput!): UploadUrl!

  # Demo Assets
  demoAssets(theme: DemoTheme): [DemoAsset!]!
}

type Mutation {
  # Authentication
  signIn(input: SignInInput!): SignInPayload!
  signOut: Boolean!

  # Projects
  updateProject(input: UpdateProjectInput!): Project!

  # Rooms
  createRoom(input: CreateRoomInput!): Room!
  uploadRoomAssets(input: UploadRoomAssetsInput!): Room!
  updateRoom(input: UpdateRoomInput!): Room!
}

type Subscription {
  # Projects
  projectUpdated: Project!

  # Rooms
  roomUpdated(projectId: ID!): Room!
}
