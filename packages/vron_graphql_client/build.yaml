# GraphQL Code Generation Configuration
# Generates type-safe Dart classes from GraphQL operations

targets:
  $default:
    builders:
      graphql_codegen:
        enabled: true
        options:
          # Schema location
          schema: graphql/schema.graphql

          # Watch for GraphQL operation files
          sources:
            - "graphql/**/*.graphql"

          # Output configuration
          output_directory: lib/src/generated/

          # Type-safe options
          generate_helpers: true
          use_frozen: false
          scalar_mapping:
            - graphql_type: DateTime
              dart_type: DateTime
            - graphql_type: JSON
              dart_type:
                name: Map<String, dynamic>

          # Naming conventions
          naming_convention: pathedWithFields

          # Additional features
          add_query_prefix: true
          add_mutation_prefix: true
          add_subscription_prefix: true
