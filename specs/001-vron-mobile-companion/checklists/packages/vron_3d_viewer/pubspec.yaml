name: vron_3d_viewer
description: A 3D GLB model viewer package for VRON mobile app
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # 3D rendering
  three_dart: ^0.0.22
  three_dart_jsm: ^0.0.22

  # Math and transformations
  vector_math: ^2.1.4

  # Async utilities
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
